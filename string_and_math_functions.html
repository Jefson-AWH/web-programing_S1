<html>
<body bgcolor="#FEEBE7" >
<h1><center><i>STRING AND MATH FUNCTIONS</i></center></h1>
<script>
var a="hello";
var b=231;
var c="welcome";
document.write("string1: "+ a + "<br><Br>");
document.write("string2: "+ b +"<br><br>");
document.write("string3: "+ c +"<br><br>");
document.write("string4: " + a+b+c +"<br><br>");
document.write("<h3>string functions</h3>");
document.write("uppercase:" +a.toUpperCase( )+"<br> <br>");
document.write("lowercase:" +c.toLowerCase( )+"<br><br>");
document.write("<h3>math functions</h3>");
document.write("round: " +Math.round(4.6)+ "<br> <br>");
document.write("floor: " +Math.floor(4.9)+"<br> <br>");
document.write("ceil: " +Math.ceil(4.9)+"<br> <br>");
document.write("square root: " +Math.sqrt(5)+"<br> <br>");
document.write("power:" +Math.pow(2,3)+"<br> <br>");
</script>
</body>
</html>
