<!DOCTYPE html>
<html>
<head>
<title>Student registration form</title>
</head>
<body bgcolor="#FEEBE7">
<h2>student registration form</h2>
<form>
<label>Name:</label>
<input type="text" name="name" style="background-color: #FCC6BB;">
<br><br>

<label>Email:</label>
<input type="email" name="email" style="background-color: #FCC6BB;">
<br><br>
<label>Password:</label>
<input type="password" name="password" style="background-color: #FCC6BB;">
<br><br>
<label>Age:</label>
<input type="number" name="age" style="background-color: #FCC6BB;">
<br><br>
<label>Gender:</label>
<input type="radio" name="gender" value="male"  style="accent-color: #FCC6BB;">Male
<input type="radio" name="gender" value="female"  style="accent-color: #FCC6BB;">Female
<br><br>
<label>Course:</label>
<select name="course">
        <option>MCA</option>
        <option>MBA</option>
        <option>M.Tech</option>
        <option>BCA</option>
</select>
<br><br>
<label>Hobbies:</label>
<input type="checkbox" name="hobby" value="reading"  style="accent-color: #FCC6BB;">Reading
<input type="checkbox" name="hobby" value="sports"  style="accent-color: #FCC6BB;">Sports
<input type="checkbox" name="hobby" value="music"  style="accent-color: #FCC6BB;">Music
<br><br>
<label>Address:</label><br>
<textarea name="address" rows="4" cols="30" style="background-color: #FCC6BB;"></textarea>
<br><br>
<label>date of birth:</label>
<input type="date" name="dob">
<br><br>
<input type="submit" value="register" style="background-color: #FCC6BB;">
<input type="reset" value="clear" style="background-color: #FCC6BB;">
</form>
</body>
</html>
